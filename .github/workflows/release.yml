name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-X main.version=${VERSION}"

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/hitch-linux-amd64 .
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/hitch-linux-arm64 .

      - name: Generate completions
        run: |
          chmod +x dist/hitch-linux-amd64
          ./dist/hitch-linux-amd64 completions bash > dist/hitch.bash
          ./dist/hitch-linux-amd64 completions zsh > dist/_hitch
          ./dist/hitch-linux-amd64 completions fish > dist/hitch.fish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/hitch-linux-amd64
            dist/hitch-linux-arm64
            dist/hitch.bash
            dist/_hitch
            dist/hitch.fish

  copr:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Trigger COPR build
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"clone_url": "https://github.com/kuyacarlo/hitch.git", "committish": "${{ github.ref_name }}", "subdirectory": ".copr", "spec": "hitch.spec", "scm_type": "git", "srpm_build_method": "make_srpm"}' \
            "https://copr.fedorainfracloud.org/api_3/build/create/scm?ownername=kuya-carlo&projectname=hitch" \
            -H "Authorization: Bearer ${{ secrets.COPR_API_TOKEN }}"
