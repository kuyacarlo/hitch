name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update spec version
        run: |
          sed -i "s/^Version:.*/Version: ${{ steps.version.outputs.version }}/" hitch.spec
          sed -i "s/^Release:.*/Release: 1%{?dist}/" hitch.spec

      - name: Build binaries
        run: |
          LDFLAGS="-X main.version=${{ steps.version.outputs.version }}"
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/hitch-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/hitch-linux-arm64 .

      - name: Generate completions
        run: |
          chmod +x dist/hitch-linux-amd64
          ./dist/hitch-linux-amd64 completions bash > dist/hitch.bash
          ./dist/hitch-linux-amd64 completions zsh > dist/_hitch
          ./dist/hitch-linux-amd64 completions fish > dist/hitch.fish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/hitch-linux-amd64
            dist/hitch-linux-arm64
            dist/hitch.bash
            dist/_hitch
            dist/hitch.fish
